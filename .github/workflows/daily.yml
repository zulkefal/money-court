name: Daily Money Court video

on:
  # 04:00 UTC = 09:00 PKT. daily_pipeline.py picks its own publishAt window
  # within PKT working hours, so this just needs to fire well before that.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      character:
        description: 'Force a mascot (judge_vera / detective_cash / coach_vault / doctor_dollar). Empty = auto-rotate.'
        required: false
        default: ''
      topic:
        description: 'Force a topic. Empty = pick next un-cooled-down topic.'
        required: false
        default: ''
      slots:
        description: 'Videos this run (1, 2, or 3).'
        required: false
        default: '2'
      no_upload:
        description: 'Render only, skip YouTube upload.'
        type: boolean
        default: false
      dry_run:
        description: 'Generate the script only, skip render and upload.'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Required so the bot can commit used_topics.json + the generated script back.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full ref to push the cooldown-state commit back.
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg + Liberation font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          # YouTube OAuth (one-time bootstrap via auth.py, stored as repo secrets)
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Claude (script_generator). Optional: if unset, daily_pipeline.py runs in
          # JSON-only mode and only renders scripts already in scripts/*.json.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Linux ffmpeg + caption font (override Mac defaults from settings.py)
          FFMPEG_BIN: ffmpeg
          FFPROBE_BIN: ffprobe
          CAPTION_FONT: /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf
          OUTPUT_DIR: ./outputs
          LOG_LEVEL: INFO
        run: |
          ARGS="--slots ${{ inputs.slots || '2' }}"
          if [ -n "${{ inputs.character }}" ]; then ARGS="$ARGS --character ${{ inputs.character }}"; fi
          if [ -n "${{ inputs.topic }}" ];     then ARGS="$ARGS --topic \"${{ inputs.topic }}\""; fi
          if [ "${{ inputs.no_upload }}" = "true" ]; then ARGS="$ARGS --no-upload"; fi
          if [ "${{ inputs.dry_run }}" = "true" ];   then ARGS="$ARGS --dry-run"; fi
          echo "running: python daily_pipeline.py $ARGS"
          eval "python daily_pipeline.py $ARGS"

      - name: Snapshot YouTube stats
        if: success() && inputs.dry_run != 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          OUTPUT_DIR: ./outputs
        run: |
          # Pull views/likes/comments for every video on the channel.
          # Saves outputs/stats/<date>.json — grows by 1 file/day for trend analysis.
          python stats.py | tee outputs/stats/latest.txt || echo "stats step failed (non-fatal)"

      - name: Commit cooldown state, archived script, queue backfill, stats
        if: success()
        run: |
          git config user.name  "money-crew-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/used_topics.json outputs/stats/ scripts/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no state changes to commit"
          else
            git commit -m "chore(daily): run $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Upload rendered mp4 as artifact (no-upload runs only)
        if: success() && inputs.no_upload == true
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.run_id }}
          path: outputs/final/*.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: Upload logs + final mp4 on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-debug-${{ github.run_id }}
          path: |
            logs/
            outputs/final/
            outputs/images/
            outputs/voiceovers/
          if-no-files-found: ignore
          retention-days: 7
